<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="NEK LEADS - Volunteer & Manpower Management" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>NEK LEADS</title>
  </head>
  <body>
    <div id="splash-screen" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #000000; z-index: 99999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.5s ease-out, visibility 0.5s ease-out;">
      <style>
        .splash-logo {
          font-family: 'Outfit', sans-serif;
          font-size: 42px;
          font-weight: 800;
          letter-spacing: 2px;
          color: #ffffff;
          display: flex;
          align-items: baseline;
          gap: 6px;
          animation: pulse 1.5s ease-in-out infinite;
        }
        .splash-sub {
          font-size: 18px;
          font-weight: 500;
          letter-spacing: 4px;
          color: #888888;
        }
        .splash-spinner {
          width: 32px;
          height: 32px;
          border: 3px solid rgba(255, 255, 255, 0.1);
          border-radius: 50%;
          border-top-color: #ffffff;
          animation: spin 1s ease-in-out infinite;
          margin-top: 40px;
        }
        @keyframes pulse {
          0%, 100% { opacity: 1; transform: scale(1); }
          50% { opacity: 0.8; transform: scale(0.98); }
        }
        @keyframes spin {
          to { transform: rotate(360deg); }
        }
      </style>
      <div class="splash-logo">NEK. <span class="splash-sub">LEADS</span></div>
      <div class="splash-spinner"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
