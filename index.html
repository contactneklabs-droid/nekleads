<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NEK LEADS" />
    <meta name="description" content="NEK LEADS - Volunteer & Manpower Management" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>NEK LEADS</title>
  </head>
  <body ontouchstart="">
    <div id="splash-screen" class="splash-container">
      <style>
        :root {
          --splash-bg: #FFFFFF;
          --splash-text: #000000;
          --splash-sub: #777777;
          --splash-pill-bg: #000000;
          --splash-pill-text: #FFFFFF;
          --splash-line: #000000;
          --splash-border: #000000;
        }

        @media (prefers-color-scheme: dark) {
          :root {
            --splash-bg: #000000;
            --splash-text: #FFFFFF;
            --splash-sub: #888888;
            --splash-pill-bg: #FFFFFF;
            --splash-pill-text: #000000;
            --splash-line: #FFFFFF;
            --splash-border: #FFFFFF;
          }
        }

        .splash-container {
          position: fixed;
          top: 0;
          left: 0;
          width: 100vw;
          height: 100vh;
          background-color: var(--splash-bg);
          color: var(--splash-text);
          z-index: 99999;
          display: flex;
          flex-direction: column;
          justify-content: space-between;
          padding: 48px 32px calc(48px + env(safe-area-inset-bottom)) 32px;
          box-sizing: border-box;
          overflow: hidden;
          font-family: 'Inter', -apple-system, sans-serif;
          transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.6s ease;
        }

        @keyframes fadeInSlideUp {
          0% { opacity: 0; transform: translateY(18px); }
          100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes heroReveal {
          0% { opacity: 0; transform: translateY(40px) scale(0.96); letter-spacing: -4px; }
          100% { opacity: 1; transform: translateY(0) scale(1); letter-spacing: -2px; }
        }
        @keyframes subtlePulse {
          0%, 100% { opacity: 0.35; }
          50% { opacity: 0.75; }
        }
        @keyframes lineExpand {
          0% { transform: scaleX(0); }
          100% { transform: scaleX(1); }
        }

        .splash-top-section {
          animation: fadeInSlideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
          display: flex;
          justify-content: space-between;
          align-items: flex-start;
          width: 100%;
        }
        .splash-bottom-meta {
          animation: fadeInSlideUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.15s both;
          display: flex;
          align-items: flex-end;
          justify-content: space-between;
          gap: 16px;
          margin-bottom: 20px;
          flex-wrap: wrap;
        }
        .splash-title-wrapper {
          animation: heroReveal 1s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both;
          width: 100%;
        }
        .splash-title-text {
          font-family: 'Outfit', sans-serif;
          font-size: clamp(68px, 18vw, 132px);
          font-weight: 900;
          line-height: 0.88;
          letter-spacing: -2px;
          color: var(--splash-text);
          margin: 0;
          padding: 0;
          text-transform: none;
        }
        .splash-meta-block {
          display: flex;
          flex-direction: column;
          gap: 4px;
        }
        .splash-meta-label {
          font-size: 11px;
          font-weight: 500;
          color: var(--splash-sub);
          letter-spacing: 0.2px;
        }
        .splash-meta-val {
          font-size: 13px;
          font-weight: 600;
          color: var(--splash-text);
          letter-spacing: -0.2px;
        }
        .splash-badge {
          display: inline-flex;
          align-items: center;
          gap: 6px;
          padding: 3px 8px;
          background: var(--splash-pill-bg);
          color: var(--splash-pill-text);
          border-radius: 999px;
          font-size: 10px;
          font-weight: 600;
          letter-spacing: 0.4px;
          text-transform: uppercase;
        }
        .splash-dot {
          width: 5px;
          height: 5px;
          border-radius: 50%;
          background: var(--splash-pill-text);
          animation: subtlePulse 1.4s ease-in-out infinite;
        }
        .splash-progress-line {
          width: 100%;
          height: 2px;
          background: var(--splash-line);
          transform-origin: left;
          animation: lineExpand 1.6s cubic-bezier(0.65, 0, 0.35, 1) forwards;
          margin-top: 16px;
        }
      </style>

      <!-- Top minimal status indicator -->
      <div class="splash-top-section">
        <div class="splash-badge">
          <div class="splash-dot"></div>
          <span>NEK OS</span>
        </div>
        <div style="font-size: 12px; font-weight: 500; color: var(--splash-sub); letter-spacing: 0.5px;">
          PWA &bull; v1.0
        </div>
      </div>

      <!-- Center graphic spacer -->
      <div style="flex: 1; min-height: 40px;"></div>

      <!-- Bottom section matching the reference mockup -->
      <div style="width: 100%; display: flex; flex-direction: column;">
        <div class="splash-bottom-meta">
          <div class="splash-meta-block">
            <div style="display: flex; align-items: center; gap: 6px; margin-bottom: 2px;">
              <span style="font-size: 11px; font-weight: 700; color: var(--splash-text);">NEK LEADS</span>
              <span style="font-size: 10px; padding: 1px 6px; border: 1px solid var(--splash-border); border-radius: 12px; font-weight: 600; color: var(--splash-text);">PWA</span>
            </div>
            <div class="splash-meta-label">Event & Manpower Desk</div>
          </div>

          <div class="splash-meta-block">
            <div class="splash-meta-label">Production Year</div>
            <div class="splash-meta-val">2026.1</div>
          </div>

          <div class="splash-meta-block" style="text-align: right;">
            <div class="splash-meta-label">Crafted for</div>
            <div class="splash-meta-val">NEK Labs</div>
          </div>
        </div>

        <!-- Massive oversized Hero Display Typography (like 'Studio') -->
        <div class="splash-title-wrapper">
          <h1 class="splash-title-text">Studio</h1>
          <div class="splash-progress-line"></div>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
